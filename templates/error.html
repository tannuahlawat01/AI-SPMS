{% extends 'base.html' %}
{% block title %}Error {{ code }} | AI-SPMS{% endblock %}
{% block content %}
<div class="card error-box">
  <div class="num">{{ code }}</div>
  <p>{{ msg }}</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary">Go home</a>
</div>
{% endblock %}
{% block public %}{{ self.content() }}{% endblock %}
